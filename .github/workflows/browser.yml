# Manual browser checks; screenshots are kept as a workflow artifact.
name: browser
on: { workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Studio
        run: node apps/studio/tests/browser.mjs
      - name: Mirrorlab
        working-directory: apps/mirrorlab
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-check-results, path: '**/test-results/' }
