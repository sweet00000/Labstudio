# Publishes LabStudio to GitHub Pages. The site keeps the repository's paths, so the
# studio (/apps/studio/web/), Mirrorlab and Splat Tunnel share packages/ as they do
# in `npm run dev`; the root index.html forwards to the studio.
# Runs on manual dispatch, or on main once the repo variable ENABLE_GITHUB_PAGES is 'true'.
name: pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'apps/*/web/**', 'packages/**', 'scripts/build.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency: { group: github-pages, cancel-in-progress: true }
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
