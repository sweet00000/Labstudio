# Publishes the hub page plus every module's static app to GitHub Pages:
#   /            site/index.html
#   /mirrorlab/  apps/mirrorlab (built)
#   /splattunnel/ apps/splattunnel/web
# Runs on manual dispatch, or on main once the repo variable ENABLE_GITHUB_PAGES is 'true'.
name: pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'apps/*/web/**', 'apps/mirrorlab/scripts/build.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency: { group: github-pages, cancel-in-progress: true }
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test and build Mirrorlab
        working-directory: apps/mirrorlab
        run: npm test && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r apps/mirrorlab/dist _site/mirrorlab
          mkdir -p _site/splattunnel
          cp -r apps/splattunnel/web/index.html apps/splattunnel/web/style.css apps/splattunnel/web/favicon.svg apps/splattunnel/web/src _site/splattunnel/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
